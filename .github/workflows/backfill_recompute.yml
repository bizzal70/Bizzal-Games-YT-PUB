name: recompute correct titles for backfill (temp)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recompute:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Recompute correct titles via the real live pipeline functions
        run: python3 _tmp_recompute_titles.py
      - name: Commit the recomputed output for inspection
        run: |
          git config user.name "verify-bot"
          git config user.email "verify-bot@users.noreply.github.com"
          git add _tmp_recomputed_titles.json
          git commit -m "temp: recomputed titles output"
          git push
