name: check channel state (temp)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install -q google-api-python-client google-auth google-auth-oauthlib google-auth-httplib2
      - name: Materialize YouTube OAuth token
        env:
          BIZZAL_YT_TOKEN_JSON: ${{ secrets.BIZZAL_YT_TOKEN_JSON }}
        run: |
          mkdir -p .secrets
          printf '%s' "$BIZZAL_YT_TOKEN_JSON" > .secrets/youtube_token.json
      - name: Query live channel state for the long-forms
        run: |
          python - <<'PY'
          from google.oauth2.credentials import Credentials
          from google.auth.transport.requests import Request
          from googleapiclient.discovery import build

          SCOPES = ["https://www.googleapis.com/auth/youtube.readonly",
                    "https://www.googleapis.com/auth/youtube.force-ssl"]
          creds = Credentials.from_authorized_user_file(".secrets/youtube_token.json", SCOPES)
          creds.refresh(Request())
          yt = build("youtube", "v3", credentials=creds)

          # the 8 old confabulated long-forms + the new grounded one
          CONFAB = {
              "Spsl-LoNlSU": "Godzilla (dnd5e)",
              "BHX0I5dEuys": "Shadowdark Summoner",
              "GX69-Bzs8TU": "DCC Deathbringer items",
              "Q0KX14YQ2RA": "DCC vintage spells",
              "cOzR7vNgnrE": "DCC Clownish Evolution",
              "crW_l0OTWFc": "DCC Deathbringer crowdfunding",
              "LiVi7EacWl4": "DCC clown class",
              "KzxPM9JbqzA": "DCC Deathbringer project",
          }
          GROUNDED = {"T68wZZE980c": "Hellhound (grounded, 07-24)"}
          ALL = {**CONFAB, **GROUNDED}

          resp = yt.videos().list(part="snippet,status", id=",".join(ALL)).execute()
          found = {it["id"]: it for it in resp.get("items", [])}

          print("=== the 8 old confabulated long-forms ===")
          for vid, label in CONFAB.items():
              if vid in found:
                  print(f"  STILL LIVE [{found[vid]['status'].get('privacyStatus'):8}]  {vid}  {label}")
              else:
                  print(f"  DELETED / gone                {vid}  {label}")
          print("\n=== the new grounded long-form ===")
          for vid, label in GROUNDED.items():
              if vid in found:
                  st = found[vid]["status"]
                  print(f"  LIVE [{st.get('privacyStatus'):8}]  {vid}  {label}")
                  print(f"       title: {found[vid]['snippet']['title']}")
              else:
                  print(f"  DELETED / gone  {vid}  {label}")

          # what long-form-length videos are actually on the channel right now?
          ch = yt.channels().list(part="contentDetails", mine=True).execute()
          uploads = ch["items"][0]["contentDetails"]["relatedPlaylists"]["uploads"]
          ids, token = [], None
          while True:
              r = yt.playlistItems().list(part="snippet", playlistId=uploads, maxResults=50, pageToken=token).execute()
              ids += [i["snippet"]["resourceId"]["videoId"] for i in r.get("items", [])]
              token = r.get("nextPageToken")
              if not token:
                  break
          print(f"\n=== channel currently has {len(ids)} total uploads ===")
          # tally durations to see how many are long-form (> 3 min)
          longs = []
          for i in range(0, len(ids), 50):
              d = yt.videos().list(part="contentDetails,snippet,status", id=",".join(ids[i:i+50])).execute()
              for it in d.get("items", []):
                  dur = it["contentDetails"]["duration"]
                  import re as _re
                  m = _re.match(r"PT(?:(\d+)M)?(?:(\d+)S)?", dur)
                  secs = (int(m.group(1) or 0)*60 + int(m.group(2) or 0)) if m else 0
                  if secs > 180:
                      longs.append((it["id"], it["status"].get("privacyStatus"), secs, it["snippet"]["title"][:50]))
          print(f"long-form (>3min) videos live on channel: {len(longs)}")
          for vid, priv, secs, title in longs:
              print(f"  [{priv:8}] {secs//60}m{secs%60:02d}  {vid}  {title}")
          PY
