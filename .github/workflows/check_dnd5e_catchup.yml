name: check dnd5e catchup video (temp, read-only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install -q google-api-python-client google-auth google-auth-oauthlib google-auth-httplib2
      - name: Materialize YouTube OAuth token
        env:
          BIZZAL_YT_TOKEN_JSON: ${{ secrets.BIZZAL_YT_TOKEN_JSON }}
        run: |
          mkdir -p .secrets
          printf '%s' "$BIZZAL_YT_TOKEN_JSON" > .secrets/youtube_token.json
      - name: Check the video (READ ONLY)
        run: |
          python - <<'PY'
          from google.oauth2.credentials import Credentials
          from google.auth.transport.requests import Request
          from googleapiclient.discovery import build

          VID = "EqSt72QWOQM"

          SCOPES = ["https://www.googleapis.com/auth/youtube.readonly"]
          creds = Credentials.from_authorized_user_file(".secrets/youtube_token.json", SCOPES)
          creds.refresh(Request())
          yt = build("youtube", "v3", credentials=creds)

          resp = yt.videos().list(part="snippet,status,contentDetails", id=VID).execute()
          items = resp.get("items", [])
          print("CHECK_START")
          if not items:
              print(f"{VID}: MISSING")
          else:
              it = items[0]
              print(f"{VID}: privacy={it['status'].get('privacyStatus')} duration={it['contentDetails'].get('duration')}")
              print(f"  title: {it['snippet']['title']}")
          print("CHECK_END")
          PY
