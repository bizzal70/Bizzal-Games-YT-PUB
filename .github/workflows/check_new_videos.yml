name: check new regen videos (temp, read-only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install -q google-api-python-client google-auth google-auth-oauthlib google-auth-httplib2
      - name: Materialize YouTube OAuth token
        env:
          BIZZAL_YT_TOKEN_JSON: ${{ secrets.BIZZAL_YT_TOKEN_JSON }}
        run: |
          mkdir -p .secrets
          printf '%s' "$BIZZAL_YT_TOKEN_JSON" > .secrets/youtube_token.json
      - name: Check new videos (READ ONLY)
        run: |
          python - <<'PY'
          from google.oauth2.credentials import Credentials
          from google.auth.transport.requests import Request
          from googleapiclient.discovery import build

          IDS = ["FJP7pQEuu58", "EJNz3HLJ2ZU"]

          SCOPES = ["https://www.googleapis.com/auth/youtube.readonly"]
          creds = Credentials.from_authorized_user_file(".secrets/youtube_token.json", SCOPES)
          creds.refresh(Request())
          yt = build("youtube", "v3", credentials=creds)

          resp = yt.videos().list(part="snippet,status,contentDetails", id=",".join(IDS)).execute()
          found = {it["id"]: it for it in resp.get("items", [])}

          print("CHECK_START")
          for v in IDS:
              it = found.get(v)
              if not it:
                  print(f"{v}: MISSING")
                  continue
              title = it["snippet"]["title"]
              privacy = it["status"].get("privacyStatus")
              duration = it.get("contentDetails", {}).get("duration")
              desc_head = it["snippet"]["description"][:150].replace("\n", " | ")
              print(f"{v}: privacy={privacy} duration={duration}")
              print(f"  title: {title}")
              print(f"  desc:  {desc_head}")
          print("CHECK_END")
          PY
