name: Check secrets & API keys

on:
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install google-auth google-auth-oauthlib requests psycopg[binary]

      - name: Run health checks
        env:
          BIZZAL_YT_CLIENT_ID:         ${{ secrets.BIZZAL_YT_CLIENT_ID }}
          BIZZAL_YT_CLIENT_SECRET:     ${{ secrets.BIZZAL_YT_CLIENT_SECRET }}
          BIZZAL_YT_TOKEN_JSON:        ${{ secrets.BIZZAL_YT_TOKEN_JSON }}
          BIZZAL_OPENAI_API_KEY:       ${{ secrets.BIZZAL_OPENAI_API_KEY }}
          BIZZAL_REPLICATE_API_TOKEN:  ${{ secrets.BIZZAL_REPLICATE_API_TOKEN }}
          BIZZAL_DB_URL:               ${{ secrets.BIZZAL_DB_URL }}
          SUPABASE_URL:                ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY:   ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BIZZAL_IG_ACCESS_TOKEN:      ${{ secrets.BIZZAL_IG_ACCESS_TOKEN }}
          BIZZAL_IG_USER_ID:           ${{ secrets.BIZZAL_IG_USER_ID }}
        run: |
          python - << 'PYEOF'
import os, json, sys, urllib.request, urllib.parse

PASS = "\033[32m PASS\033[0m"
FAIL = "\033[31m FAIL\033[0m"
WARN = "\033[33m WARN\033[0m"
results = []

def check(name, fn):
    try:
        msg = fn()
        print(f"{PASS}  {name}: {msg}")
        results.append((name, True, msg))
    except Exception as e:
        print(f"{FAIL}  {name}: {e}")
        results.append((name, False, str(e)))

# ── 1. Secret presence ──────────────────────────────────────────────────────
for key in [
    "BIZZAL_YT_CLIENT_ID","BIZZAL_YT_CLIENT_SECRET","BIZZAL_YT_TOKEN_JSON",
    "BIZZAL_OPENAI_API_KEY","BIZZAL_REPLICATE_API_TOKEN",
    "BIZZAL_DB_URL","SUPABASE_URL","SUPABASE_SERVICE_ROLE_KEY",
    "BIZZAL_IG_ACCESS_TOKEN","BIZZAL_IG_USER_ID",
]:
    val = os.getenv(key, "")
    def _check(k=key, v=val):
        if not v:
            raise ValueError("secret is empty / not set")
        return f"set ({len(v)} chars)"
    check(f"secret:{key}", _check)

# ── 2. YouTube token JSON valid + refresh ───────────────────────────────────
def check_yt():
    raw = os.environ["BIZZAL_YT_TOKEN_JSON"]
    tok = json.loads(raw)
    required = ["refresh_token","client_id","client_secret","token_uri"]
    missing = [k for k in required if not tok.get(k)]
    if missing:
        raise ValueError(f"token JSON missing fields: {missing}")
    # Attempt a real token refresh
    data = urllib.parse.urlencode({
        "client_id":     tok["client_id"],
        "client_secret": tok["client_secret"],
        "refresh_token": tok["refresh_token"],
        "grant_type":    "refresh_token",
    }).encode()
    req = urllib.request.Request("https://oauth2.googleapis.com/token", data=data)
    with urllib.request.urlopen(req, timeout=10) as r:
        resp = json.loads(r.read())
    if "access_token" not in resp:
        raise ValueError(f"no access_token in response: {resp}")
    return f"token refreshed OK (expires_in={resp.get('expires_in','?')}s)"
check("youtube:token_refresh", check_yt)

# ── 3. YouTube channel reachable ────────────────────────────────────────────
def check_yt_channel():
    raw = json.loads(os.environ["BIZZAL_YT_TOKEN_JSON"])
    # re-refresh to get fresh access token
    data = urllib.parse.urlencode({
        "client_id":     raw["client_id"],
        "client_secret": raw["client_secret"],
        "refresh_token": raw["refresh_token"],
        "grant_type":    "refresh_token",
    }).encode()
    with urllib.request.urlopen(
        urllib.request.Request("https://oauth2.googleapis.com/token", data=data), timeout=10
    ) as r:
        access_token = json.loads(r.read())["access_token"]
    req = urllib.request.Request(
        "https://www.googleapis.com/youtube/v3/channels?part=snippet&mine=true",
        headers={"Authorization": f"Bearer {access_token}"}
    )
    with urllib.request.urlopen(req, timeout=10) as r:
        resp = json.loads(r.read())
    items = resp.get("items", [])
    if not items:
        raise ValueError("no channel found for this token")
    name = items[0]["snippet"]["title"]
    return f"channel OK: '{name}'"
check("youtube:channel_access", check_yt_channel)

# ── 4. OpenAI ───────────────────────────────────────────────────────────────
def check_openai():
    key = os.environ["BIZZAL_OPENAI_API_KEY"]
    req = urllib.request.Request(
        "https://api.openai.com/v1/models",
        headers={"Authorization": f"Bearer {key}"}
    )
    with urllib.request.urlopen(req, timeout=10) as r:
        resp = json.loads(r.read())
    count = len(resp.get("data", []))
    return f"{count} models accessible"
check("openai:api_key", check_openai)

# ── 5. Replicate ────────────────────────────────────────────────────────────
def check_replicate():
    token = os.environ["BIZZAL_REPLICATE_API_TOKEN"]
    req = urllib.request.Request(
        "https://api.replicate.com/v1/account",
        headers={"Authorization": f"Bearer {token}"}
    )
    with urllib.request.urlopen(req, timeout=10) as r:
        resp = json.loads(r.read())
    return f"account OK: {resp.get('username','?')}"
check("replicate:api_token", check_replicate)

# ── 6. Supabase / Postgres ──────────────────────────────────────────────────
def check_db():
    import psycopg
    url = os.environ["BIZZAL_DB_URL"]
    with psycopg.connect(url, connect_timeout=10) as conn:
        with conn.cursor() as cur:
            cur.execute("SELECT current_database(), current_user")
            db, user = cur.fetchone()
    return f"connected db={db} user={user}"
check("supabase:postgres", check_db)

# ── 7. Supabase REST API ────────────────────────────────────────────────────
def check_supabase_api():
    url  = os.environ["SUPABASE_URL"].rstrip("/")
    key  = os.environ["SUPABASE_SERVICE_ROLE_KEY"]
    req  = urllib.request.Request(
        f"{url}/rest/v1/",
        headers={"apikey": key, "Authorization": f"Bearer {key}"}
    )
    with urllib.request.urlopen(req, timeout=10) as r:
        r.read()
    return "REST endpoint reachable"
check("supabase:rest_api", check_supabase_api)

# ── 8. Instagram ────────────────────────────────────────────────────────────
def check_ig():
    token   = os.environ["BIZZAL_IG_ACCESS_TOKEN"]
    user_id = os.environ["BIZZAL_IG_USER_ID"]
    url = (f"https://graph.facebook.com/v19.0/{user_id}"
           f"?fields=username,name&access_token={token}")
    with urllib.request.urlopen(url, timeout=10) as r:
        resp = json.loads(r.read())
    if "error" in resp:
        raise ValueError(resp["error"].get("message", resp["error"]))
    return f"IG account OK: @{resp.get('username','?')}"
check("instagram:access_token", check_ig)

# ── Summary ─────────────────────────────────────────────────────────────────
print()
print("=" * 55)
passed = sum(1 for _,ok,_ in results if ok)
failed = sum(1 for _,ok,_ in results if not ok)
print(f"Results: {passed} passed, {failed} failed")
if failed:
    print("\nFailed checks:")
    for name,ok,msg in results:
        if not ok:
            print(f"  - {name}: {msg}")
    sys.exit(1)
PYEOF
