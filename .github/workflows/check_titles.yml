name: check current titles before backfill (temp, read-only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install -q google-api-python-client google-auth google-auth-oauthlib google-auth-httplib2
      - name: Materialize YouTube OAuth token
        env:
          BIZZAL_YT_TOKEN_JSON: ${{ secrets.BIZZAL_YT_TOKEN_JSON }}
        run: |
          mkdir -p .secrets
          printf '%s' "$BIZZAL_YT_TOKEN_JSON" > .secrets/youtube_token.json
      - name: List current titles (READ ONLY, no updates)
        run: |
          python - <<'PY'
          from google.oauth2.credentials import Credentials
          from google.auth.transport.requests import Request
          from googleapiclient.discovery import build

          IDS = [
              "r6QuBtR50ww", "fEn8ONVZqbA", "i_wUZWJdYwI",
              "sZO312tGmsY", "3VYIZe5pcno", "6y-I5FffV8Q",
              "xOj74v5ekDQ", "xskRZfy8Vpc",
          ]

          SCOPES = ["https://www.googleapis.com/auth/youtube.readonly"]
          creds = Credentials.from_authorized_user_file(".secrets/youtube_token.json", SCOPES)
          creds.refresh(Request())
          yt = build("youtube", "v3", credentials=creds)

          resp = yt.videos().list(part="snippet,status", id=",".join(IDS)).execute()
          found = {it["id"]: it for it in resp.get("items", [])}

          print("TITLES_CSV_START")
          print("video_id,privacy_status,title_len,title")
          for v in IDS:
              it = found.get(v)
              if not it:
                  print(f"{v},MISSING,,")
                  continue
              st = it["status"].get("privacyStatus", "?")
              title = it["snippet"]["title"]
              print(f"{v},{st},{len(title)},{title}")
          print("TITLES_CSV_END")
          PY
