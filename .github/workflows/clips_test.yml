name: clips test (temp)

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  TZ: America/Denver
  BIZZAL_DB_URL: ${{ secrets.BIZZAL_DB_URL }}
  BIZZAL_OPENAI_API_KEY: ${{ secrets.BIZZAL_OPENAI_API_KEY }}
  BIZZAL_REPLICATE_API_TOKEN: ${{ secrets.BIZZAL_REPLICATE_API_TOKEN }}
  BIZZAL_YT_CLIENT_ID: ${{ secrets.BIZZAL_YT_CLIENT_ID }}
  BIZZAL_YT_CLIENT_SECRET: ${{ secrets.BIZZAL_YT_CLIENT_SECRET }}
  BIZZAL_YT_TOKEN_FILE: /home/runner/work/Bizzal-Games-YT-PUB/Bizzal-Games-YT-PUB/.secrets/youtube_token.json
  BIZZAL_YT_NONINTERACTIVE: "1"
  BIZZAL_OPENAI_MODEL: "gpt-4o"
  BIZZAL_ENABLE_AI: "1"
  BIZZAL_ENABLE_TTS: "1"
  BIZZAL_ENABLE_BG_IMAGE: "1"
  BIZZAL_ENABLE_BG_MUSIC: "1"
  BIZZAL_BG_MUSIC_GAIN: "0.20"
  BIZZAL_TTS_SPEED: "0.92"
  BIZZAL_BRAND_ICON_SIZE: "100"
  BIZZAL_CLIPS_PER_LONGFORM: "1"
  BIZZAL_YT_PRIVACY: "unlisted"

jobs:
  clips:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ffmpeg
        run: sudo apt-get install -y ffmpeg
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -q Pillow
      - name: Materialize YouTube OAuth token
        env:
          BIZZAL_YT_TOKEN_JSON: ${{ secrets.BIZZAL_YT_TOKEN_JSON }}
        run: |
          mkdir -p .secrets
          printf '%s' "$BIZZAL_YT_TOKEN_JSON" > .secrets/youtube_token.json
      - name: Write a synthetic long-form atom + run clips
        run: |
          DAY="clipstest"
          mkdir -p data/atoms_longform_dcc/validated
          python - <<'PY'
          import json
          atom = {
            "day": "clipstest", "system": "dcc", "content_type": "longform",
            "title": "Chaos and corruption in DCC",
            "youtube_title": "Spellcasting Check failures trigger chaos in DCC",
            "script": {"sections": [
              {"heading": "The failed check", "body": "A failed spellcasting check in DCC doesn't just fizzle. Roll on the misfire or corruption table for that spell. Natural 1 always triggers the worst column, and the judge reads the result aloud."},
              {"heading": "Corruption accrues", "body": "Corruption is permanent unless removed by specific magic. Minor corruption is cosmetic; major reshapes the body; greater can end the character. It stacks across a career, so casters degrade over time."},
              {"heading": "Luck burns it back", "body": "You can spend Luck point-for-point to raise a spell check after the roll. Halflings and Thieves regenerate Luck, so they can push checks the wizard cannot. One point can turn a misfire into a success."}
            ]}
          }
          json.dump(atom, open("data/atoms_longform_dcc/validated/clipstest.json","w"), indent=2)
          print("wrote synthetic long-form atom")
          PY
          bash bin/longform/run_clips_for_system.sh dcc "$DAY"
