name: dedupe channel (temp)

on:
  workflow_dispatch:
    inputs:
      execute:
        description: 'Set "true" to actually unlist. Default is a dry run.'
        required: false
        default: "false"

permissions:
  contents: read

jobs:
  dedupe:
    runs-on: ubuntu-latest
    env:
      BIZZAL_YT_TOKEN_FILE: /home/runner/work/Bizzal-Games-YT-PUB/Bizzal-Games-YT-PUB/.secrets/youtube_token.json
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install -q google-api-python-client google-auth google-auth-oauthlib google-auth-httplib2
      - name: Materialize YouTube OAuth token
        env:
          BIZZAL_YT_TOKEN_JSON: ${{ secrets.BIZZAL_YT_TOKEN_JSON }}
        run: |
          mkdir -p .secrets
          printf '%s' "$BIZZAL_YT_TOKEN_JSON" > .secrets/youtube_token.json
      - name: Find duplicate groups and unlist the losers
        env:
          EXECUTE: ${{ github.event.inputs.execute }}
        run: |
          python - <<'PY'
          import os, sys
          sys.path.insert(0, "bin/core")
          import content_ledger as L
          from google.oauth2.credentials import Credentials
          from google.auth.transport.requests import Request
          from googleapiclient.discovery import build

          EXECUTE = (os.environ.get("EXECUTE") or "").strip().lower() == "true"
          # Never auto-unlist flagship long-form on a view-count technicality.
          PROTECTED = {"KzxPM9JbqzA"}   # Deathbringer long-form (thumbnail + CC)

          import re as _re
          _SYSTEMS = (("shadowdark",), ("dcc", "dungeoncrawlclassics"),
                      ("dnd", "dnd5e", "dnd5e2024", "dungeonsanddragons"))
          def _system_of(title):
              tags = set(_re.findall(r'#(\w+)', (title or '').lower()))
              for group in _SYSTEMS:
                  if tags & set(group):
                      return group[0]
              return ''   # new-format titles carry no tags

          SCOPES = ["https://www.googleapis.com/auth/youtube.upload",
                    "https://www.googleapis.com/auth/youtube.readonly",
                    "https://www.googleapis.com/auth/youtube.force-ssl"]
          creds = Credentials.from_authorized_user_file(".secrets/youtube_token.json", SCOPES)
          creds.refresh(Request())
          yt = build("youtube", "v3", credentials=creds)

          ch = yt.channels().list(part="contentDetails", mine=True).execute()
          uploads = ch["items"][0]["contentDetails"]["relatedPlaylists"]["uploads"]
          ids, token = [], None
          while True:
              r = yt.playlistItems().list(part="snippet", playlistId=uploads,
                                          maxResults=50, pageToken=token).execute()
              for i in r.get("items", []):
                  _v = i["snippet"]["resourceId"]["videoId"]
                  if _v not in ids:
                      ids.append(_v)   # a video can appear twice in the playlist
              token = r.get("nextPageToken")
              if not token:
                  break

          vids = []
          for i in range(0, len(ids), 50):
              r = yt.videos().list(part="snippet,status,statistics",
                                   id=",".join(ids[i:i+50])).execute()
              for it in r.get("items", []):
                  vids.append({
                      "id": it["id"],
                      "title": it["snippet"]["title"],
                      "privacy": it["status"]["privacyStatus"],
                      "views": int(it.get("statistics", {}).get("viewCount", 0) or 0),
                      "published": it["snippet"]["publishedAt"][:10],
                      "tokens": L.tokens(it["snippet"]["title"]),
                      "system": _system_of(it["snippet"]["title"]),
                  })
          print(f"scanned {len(vids)} videos\n")

          # Greedy grouping by the same key/similarity the ledger enforces.
          groups, used = [], set()
          for i, a in enumerate(vids):
              if i in used:
                  continue
              g = [a]; used.add(i)
              for j in range(i + 1, len(vids)):
                  if j in used:
                      continue
                  if vids[j]["system"] != a["system"]:
                      continue   # a D&D Warlock is not a Shadowdark Warlock
                  if L.similarity(a["tokens"], vids[j]["tokens"]) >= L.SIMILARITY:
                      g.append(vids[j]); used.add(j)
              if len(g) > 1:
                  groups.append(g)

          print(f"{len(groups)} duplicate groups found\n")
          to_unlist = []
          for g in groups:
              g.sort(key=lambda v: (v["views"], v["published"]), reverse=True)
              keep, losers = g[0], g[1:]
              print(f"GROUP ({len(g)}):")
              print(f"   KEEP    {keep['id']}  {keep['views']:>5} views  {keep['privacy']:<8} {keep['title'][:52]}")
              for l in losers:
                  mark = "unlist" if l["privacy"] == "public" else f"skip({l['privacy']})"
                  print(f"   {mark:<7} {l['id']}  {l['views']:>5} views  {l['privacy']:<8} {l['title'][:52]}")
                  if l["privacy"] == "public" and l["id"] not in PROTECTED:
                      to_unlist.append(l)
                  elif l["id"] in PROTECTED:
                      print(f"   PROTECTED {l['id']} — left public (your call)")
              print()

          print(f"=> {len(to_unlist)} public duplicates to unlist "
                f"({'EXECUTING' if EXECUTE else 'DRY RUN â€” nothing changed'})\n")
          if EXECUTE:
              done = 0
              for v in to_unlist:
                  try:
                      st = yt.videos().list(part="status", id=v["id"]).execute()["items"][0]["status"]
                      st["privacyStatus"] = "unlisted"
                      st.pop("publishAt", None)
                      yt.videos().update(part="status", body={"id": v["id"], "status": st}).execute()
                      print(f"  unlisted {v['id']}  {v['title'][:52]}")
                      done += 1
                  except Exception as exc:
                      print(f"  FAILED   {v['id']}: {exc}")
              print(f"\nDONE: {done}/{len(to_unlist)} unlisted")
          PY
