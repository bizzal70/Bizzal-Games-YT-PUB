name: delete old stat-dump videos (temp)

on:
  workflow_dispatch:
    inputs:
      execute:
        description: 'Set "true" to actually delete. Default is a dry run.'
        required: false
        default: "false"

permissions:
  contents: read

jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install -q google-api-python-client google-auth google-auth-oauthlib google-auth-httplib2
      - name: Materialize YouTube OAuth token
        env:
          BIZZAL_YT_TOKEN_JSON: ${{ secrets.BIZZAL_YT_TOKEN_JSON }}
        run: |
          mkdir -p .secrets
          printf '%s' "$BIZZAL_YT_TOKEN_JSON" > .secrets/youtube_token.json
      - name: Delete the 2 confirmed stat-dump videos (replaced by regenerated versions)
        env:
          EXECUTE: ${{ github.event.inputs.execute }}
        run: |
          python - <<'PY'
          import os
          from google.oauth2.credentials import Credentials
          from google.auth.transport.requests import Request
          from googleapiclient.discovery import build

          EXECUTE = (os.environ.get("EXECUTE") or "").strip().lower() == "true"

          # EXACT ids only. Both replaced by newly rendered/uploaded videos:
          #   xOj74v5ekDQ (Fey Wanderer stat-dump)  -> replaced by FJP7pQEuu58
          #   xskRZfy8Vpc (Awakened Tree stat-dump) -> replaced by EJNz3HLJ2ZU
          TARGETS = {
              "xOj74v5ekDQ": "old Fey Wanderer stat-dump hook, replaced by FJP7pQEuu58",
              "xskRZfy8Vpc": "old Awakened Tree stat-dump hook, replaced by EJNz3HLJ2ZU",
          }

          SCOPES = ["https://www.googleapis.com/auth/youtube.force-ssl",
                    "https://www.googleapis.com/auth/youtube.readonly"]
          creds = Credentials.from_authorized_user_file(".secrets/youtube_token.json", SCOPES)
          creds.refresh(Request())
          yt = build("youtube", "v3", credentials=creds)

          ids = list(TARGETS)
          resp = yt.videos().list(part="snippet,status", id=",".join(ids)).execute()
          found = {it["id"]: it for it in resp.get("items", [])}

          for v in ids:
              it = found.get(v)
              if not it:
                  print(f"  !! NOT FOUND (already gone?): {v} ({TARGETS[v]})")
                  continue
              print(f"  {v}  [{it['status'].get('privacyStatus')}]  {it['snippet']['title'][:70]!r}  <- {TARGETS[v]}")

          if not EXECUTE:
              print("\nDRY RUN -- nothing deleted. Re-run with execute=true to apply.")
          else:
              for v in ids:
                  if v not in found:
                      continue
                  try:
                      yt.videos().delete(id=v).execute()
                      print(f"  deleted {v}")
                  except Exception as exc:
                      print(f"  FAILED {v}: {exc}")
          PY
