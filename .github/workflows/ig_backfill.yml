name: IG ledger backfill (temp)

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ledger-backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    env:
      BIZZAL_DB_URL: ${{ secrets.BIZZAL_DB_URL }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install -q -r requirements.txt
      - name: Backfill existing IG posts into the ledger (platform=instagram)
        run: |
          python - <<'PY'
          import json, os, re, sys
          sys.path.insert(0, "bin/core")
          import content_ledger as L

          reg = json.load(open("data/state/published_registry_instagram.json")).get("items", [])
          print(f"{len(reg)} IG posts in the registry")

          # Existing ledger rows (YT side, system-scoped) — used to inherit the
          # system for IG posts whose render path predates the per-system dirs.
          try:
              led = json.load(open("data/state/content_ledger.json")).get("items", [])
          except Exception:
              led = []
          led = [r for r in led if (r.get("token_text") or "").strip()]

          def sys_from_path(p):
              p = (p or "").lower()
              for s in ("shadowdark", "dnd5e", "dcc"):
                  if f"renders_{s}" in p:
                      return s
              return ""

          def sys_from_ledger(hook):
              toks = L.tokens(hook)
              best, bsys = 0.0, ""
              for r in led:
                  sim = L.similarity(toks, set((r.get("token_text") or "").split()))
                  if sim > best:
                      best, bsys = sim, (r.get("system_id") or "")
              return bsys if best >= 0.70 else ""

          added = blocked = nohook = 0
          for it in reg:
              hook = (it.get("hook") or "").strip()
              if not hook:
                  nohook += 1
                  continue
              sysid = sys_from_path(it.get("video_path")) or sys_from_ledger(hook)
              dup, why, _ = L.check(hook, ".", system_id=sysid, platform="instagram")
              if dup:
                  blocked += 1
                  continue
              L.record(hook, ".", system_id=sysid, platform="instagram",
                       kind="reel", title=hook,
                       video_id=it.get("instagram_post_id", ""), day=it.get("day", ""))
              added += 1
              print(f"  + [{sysid or 'unscoped':10}] {hook[:52]}")
          print(f"\nIG BACKFILL: {added} recorded, {blocked} already-present/near-dup, {nohook} no-hook")
          PY
      - name: Commit the ledger mirror
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/state/content_ledger.json || true
          if git diff --cached --quiet; then
            echo "no ledger changes"; exit 0
          fi
          git commit -m "chore(ledger): backfill existing IG posts [skip ci]"
          BRANCH="$(git rev-parse --abbrev-ref HEAD)"
          for attempt in 1 2 3 4 5; do
            if git pull --rebase --autostash origin "$BRANCH" && git push origin "HEAD:$BRANCH"; then
              echo "committed (attempt $attempt)"; exit 0
            fi
            sleep $((attempt * 4))
          done
          echo "::warning::ledger commit failed after retries"
