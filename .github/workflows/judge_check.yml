name: editor judge check (temp)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      BIZZAL_OPENAI_API_KEY: ${{ secrets.BIZZAL_OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Judge a GOOD script vs a BAD script
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, "bin/core")
          import script_quality as Q

          GOOD = """A failed spellcasting check in DCC doesn't just fizzle. Roll on the
          misfire or corruption table for that spell. A natural 1 always triggers the worst
          column, and the judge reads the result aloud.

          Corruption accrues. Minor corruption is cosmetic; major reshapes the body; greater
          can end the character. It stacks across a career, so casters degrade over time
          unless removed by specific magic.

          Luck burns it back. You can spend Luck point-for-point to raise a spell check after
          the roll. Halflings and Thieves regenerate Luck, so they can push checks a wizard
          cannot. One point can turn a misfire into a success."""

          BAD = """Welcome back to the channel! Today we're diving into the amazing world of
          tabletop roleplaying games. There's so much to discover and explore, and I think
          you're really going to love what we have in store.

          Magic is one of the coolest parts of any RPG. It can do all sorts of interesting
          things and really change how your game feels at the table. Every group is different,
          so try things out and see what works for you.

          At the end of the day, the most important rule is to have fun with your friends.
          Don't sweat the small stuff. Thanks for watching and we'll see you next time!"""

          for name, txt in (("GOOD (dense, specific)", GOOD), ("BAD (generic filler)", BAD)):
              v = Q.judge(txt, context="DCC long-form")
              print(f"{name}: score={v.score} available={v.available}")
              print(f"   issues={v.issues}")
              print(f"   -> ok(>=4.0)={v.ok}  publishable(>=3.0)={v.publishable}")
              print()

          g = Q.judge(GOOD, context="DCC long-form")
          b = Q.judge(BAD, context="DCC long-form")
          print("DISCRIMINATION:", "PASS" if g.score > b.score else "FAIL")
          print("BAD BLOCKED   :", "PASS" if not b.publishable else "FAIL (would publish filler!)")
          print("GOOD PASSES   :", "PASS" if g.ok else "FAIL (rejecting good content)")
          PY
