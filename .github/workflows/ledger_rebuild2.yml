name: content ledger rebuild (temp)

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ledger-backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    env:
      BIZZAL_DB_URL: ${{ secrets.BIZZAL_DB_URL }}
      BIZZAL_YT_TOKEN_FILE: /home/runner/work/Bizzal-Games-YT-PUB/Bizzal-Games-YT-PUB/.secrets/youtube_token.json
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install -q -r requirements.txt
      - name: Materialize YouTube OAuth token
        env:
          BIZZAL_YT_TOKEN_JSON: ${{ secrets.BIZZAL_YT_TOKEN_JSON }}
        run: |
          mkdir -p .secrets
          printf '%s' "$BIZZAL_YT_TOKEN_JSON" > .secrets/youtube_token.json
      - name: Seed ledger from every video already on the channel
        run: |
          python - <<'PY'
          import os, sys
          sys.path.insert(0, "bin/core")
          import content_ledger as L
          import json
          # purge stale rows: they stored hashtag-polluted tokens
          try:
              import psycopg
              with psycopg.connect(os.environ['BIZZAL_DB_URL'], connect_timeout=10) as c:
                  with c.cursor() as cur:
                      cur.execute(L._DDL); cur.execute('DELETE FROM published_content'); c.commit()
              print('DB ledger reset')
          except Exception as e:
              print(f'DB reset skipped: {e}')
          from google.oauth2.credentials import Credentials
          from google.auth.transport.requests import Request
          from googleapiclient.discovery import build

          SCOPES = ["https://www.googleapis.com/auth/youtube.upload",
                    "https://www.googleapis.com/auth/youtube.readonly",
                    "https://www.googleapis.com/auth/youtube.force-ssl"]
          creds = Credentials.from_authorized_user_file(".secrets/youtube_token.json", SCOPES)
          creds.refresh(Request())
          yt = build("youtube", "v3", credentials=creds)

          # Map video_id -> system from the publish registries. Hashtag
          # inference only works on legacy titles; the new formula titles carry
          # no tags, so DCC/Shadowdark/D&D new-format content was all landing
          # unscoped in one bucket where it could cross-block between systems.
          import glob, re as _re
          VID2SYS = {}
          for p in glob.glob("data/state/published_registry_*.json"):
              base = os.path.basename(p)[len("published_registry_"):-len(".json")]
              sysid = _re.sub(r"^(longform|clips)_", "", base)
              if sysid in ("instagram",):
                  continue
              try:
                  for it in json.load(open(p)).get("items", []):
                      v = it.get("youtube_video_id")
                      if v:
                          VID2SYS[v] = sysid
              except Exception:
                  pass
          print(f"registry map: {len(VID2SYS)} video->system entries")

          ch = yt.channels().list(part="contentDetails", mine=True).execute()
          uploads = ch["items"][0]["contentDetails"]["relatedPlaylists"]["uploads"]
          print(f"uploads playlist: {uploads}")

          vids, token = [], None
          while True:
              r = yt.playlistItems().list(part="snippet", playlistId=uploads,
                                          maxResults=50, pageToken=token).execute()
              for it in r.get("items", []):
                  s = it["snippet"]
                  vids.append((s["resourceId"]["videoId"], s["title"], s["publishedAt"][:10]))
              token = r.get("pageToken") or r.get("nextPageToken")
              if not token:
                  break
          print(f"found {len(vids)} videos on the channel\n")

          added = skipped = 0
          for vid, title, day in vids:
              _sid = VID2SYS.get(vid) or L.system_of(title)
              dup, why, _ = L.check(title, ".", system_id=_sid)
              if dup:
                  skipped += 1
                  continue
              _sid = VID2SYS.get(vid) or L.system_of(title)
              L.record(title, ".", kind="backfill", system_id=_sid,
                       title=title, video_id=vid, day=day)
              added += 1
              print(f"  + {title[:62]}")
          print(f"\nBACKFILL: {added} rulings recorded, {skipped} already present/similar")
          PY
      - name: Commit the ledger mirror
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/state/content_ledger.json || true
          if git diff --cached --quiet; then
            echo "no ledger changes"
            exit 0
          fi
          git commit -m "chore(ledger): backfill published content ledger [skip ci]"
          BRANCH="$(git rev-parse --abbrev-ref HEAD)"
          for attempt in 1 2 3 4 5; do
            if git pull --rebase --autostash origin "$BRANCH" && git push origin "HEAD:$BRANCH"; then
              echo "ledger committed (attempt $attempt)"; exit 0
            fi
            sleep $((attempt * 4))
          done
          echo "::warning::ledger commit failed after retries"
