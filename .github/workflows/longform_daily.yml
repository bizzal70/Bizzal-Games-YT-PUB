name: Long-form daily pipeline

on:
  schedule:
    # Mon/Wed/Fri 10am MT (16:00/17:00 UTC depending on DST)
    - cron: "0 16 * * 1,3,5"
    - cron: "0 17 * * 1,3,5"
  workflow_dispatch:
    inputs:
      system:
        description: 'System to run: dnd5e | shadowdark | dcc | all'
        required: false
        default: "all"
      dry_run:
        description: 'Set "true" to generate + render but skip YouTube upload'
        required: false
        default: "false"
      privacy:
        description: "YouTube privacy: unlisted | private | public"
        required: false
        default: "unlisted"
      make_clips:
        description: 'Set "false" to skip cutting the long-form into Shorts clips'
        required: false
        default: "true"

# Serialize runs so two overlapping scheduled triggers can never BOTH publish.
# Without this, the DST-safe double cron fired twice at once; each run's guard
# checked the registry before the other had committed, so both saw "hasn't run
# today" and published -- duplicate long-form + duplicate clips on the channel.
# cancel-in-progress:false queues the second run; its guard then correctly sees
# the first run's committed registry entry and skips. (Shorts already does this.)
concurrency:
  group: longform-pipeline
  cancel-in-progress: false

permissions:
  contents: write   # commit the long-form registry + state back to the repo

jobs:
  guard:
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.guard.outputs.proceed }}
    steps:
      - id: guard
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "manual run; skipping time guard"
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          hour="$(TZ=America/Denver date +%H)"
          today="$(TZ=America/Denver date +%F)"
          dow="$(TZ=America/Denver date +%u)"  # 1=Mon 3=Wed 5=Fri

          # Only run on Mon/Wed/Fri
          if [[ "$dow" != "1" && "$dow" != "3" && "$dow" != "5" ]]; then
            echo "not a longform day (dow=$dow); skipping"
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Catchup guard
          if [ "${hour}" -gt "10" ] 2>/dev/null; then
            ran_today=false
            for reg in data/state/published_registry_longform_*.json; do
              if [ -f "${reg}" ] && grep -q "\"day\": \"${today}\"" "${reg}"; then
                ran_today=true; break
              fi
            done
            if [ "${ran_today}" = "false" ]; then
              echo "catchup: past 10am MT, no longform entry for ${today} -- proceeding"
              echo "proceed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "longform already ran today (${today}); skipping"
          else
            echo "before 10am MT (${hour}); skipping early trigger"
          fi
          echo "proceed=false" >> "$GITHUB_OUTPUT"

  run:
    needs: guard
    if: needs.guard.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    env:
      TZ: America/Denver
      BIZZAL_DB_URL: ${{ secrets.BIZZAL_DB_URL }}
      BIZZAL_OPENAI_API_KEY: ${{ secrets.BIZZAL_OPENAI_API_KEY }}
      BIZZAL_REPLICATE_API_TOKEN: ${{ secrets.BIZZAL_REPLICATE_API_TOKEN }}
      BIZZAL_YT_CLIENT_ID: ${{ secrets.BIZZAL_YT_CLIENT_ID }}
      BIZZAL_YT_CLIENT_SECRET: ${{ secrets.BIZZAL_YT_CLIENT_SECRET }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      BIZZAL_YT_TOKEN_FILE: /home/runner/work/Bizzal-Games-YT-PUB/Bizzal-Games-YT-PUB/.secrets/youtube_token.json
      BIZZAL_YT_NONINTERACTIVE: "1"
      BIZZAL_OPENAI_MODEL: "gpt-4o"
      BIZZAL_ENABLE_AI: "1"
      BIZZAL_ENABLE_AI_SCRIPT: "1"
      BIZZAL_ENABLE_TTS: "1"
      BIZZAL_ENABLE_BG_IMAGE: "1"
      BIZZAL_ENABLE_BG_MUSIC: "1"
      BIZZAL_BG_MUSIC_GAIN: "0.20"
      # Viewer feedback (same as daily.yml): background music too loud to
      # hear the narration. Researched voice-over ducking best practice
      # (Sound On Sound, StrongMocha): ratio >=4:1 for intelligibility, fast
      # attack so it engages before a word starts, and release long enough
      # that music does not pop back up during mid-sentence breath pauses --
      # that release parameter is what actually makes ducking feel smooth
      # instead of "jarring", so it is raised above the script default
      # alongside a strong-but-not-extreme ratio.
      BIZZAL_BG_DUCK_RATIO: "5.0"
      BIZZAL_BG_DUCK_ATTACK_MS: "30"
      BIZZAL_BG_DUCK_RELEASE_MS: "700"
      BIZZAL_TTS_SPEED: "0.92"
      BIZZAL_BRAND_ICON_SIZE: "100"

    steps:
      - name: Checkout (full history for commit-back)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ffmpeg
        run: sudo apt-get install -y ffmpeg

      - name: Install Python deps
        # requirements.txt includes the google-api-python-client / google-auth
        # libs the YouTube uploader needs (the old 3-package list omitted them,
        # so the long-form upload failed with "Missing YouTube dependencies").
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -q Pillow

      - name: Materialize YouTube OAuth token
        env:
          BIZZAL_YT_TOKEN_JSON: ${{ secrets.BIZZAL_YT_TOKEN_JSON }}
        run: |
          mkdir -p .secrets
          echo "$BIZZAL_YT_TOKEN_JSON" > .secrets/youtube_token.json

      - name: Determine systems to run
        id: systems
        run: |
          INPUT="${{ github.event.inputs.system || 'all' }}"
          DOW="$(TZ=America/Denver date +%u)"
          if [ "$INPUT" = "all" ]; then
            # Rotate through every ACTIVE system in the rpg_systems DB (so a new
            # system is included automatically). Ordinal-date rotation: each
            # long-form day picks the next system, stable for the date.
            SYS="$(python3 bin/longform/pick_longform_system.py 2>/dev/null || echo dnd5e)"
            [ -z "$SYS" ] && SYS=dnd5e
            echo "systems=$SYS" >> "$GITHUB_OUTPUT"
          else
            echo "systems=$INPUT" >> "$GITHUB_OUTPUT"
          fi

      - name: Run long-form pipeline
        env:
          BIZZAL_CLOUD_SYSTEMS: ${{ steps.systems.outputs.systems }}
          BIZZAL_YT_PRIVACY: ${{ github.event.inputs.privacy || 'unlisted' }}
          BIZZAL_SKIP_PUBLISH: ${{ github.event.inputs.dry_run == 'true' && '1' || '0' }}
        run: |
          IFS=',' read -ra SYSTEMS <<< "$BIZZAL_CLOUD_SYSTEMS"
          fail=0; total=0
          for sys in "${SYSTEMS[@]}"; do
            sys="$(echo "$sys" | tr -d ' ')"
            [ -z "$sys" ] && continue
            total=$((total+1))
            echo "=== longform: $sys ==="
            if ! bin/longform/run_longform_for_system.sh "$sys"; then
              echo "WARNING: longform failed for $sys"
              fail=$((fail+1))
            fi
          done
          # Fail the run when EVERY system failed (nothing published) so the
          # run goes red and alert_on_failure fires. Previously this step
          # swallowed all failures as "non-fatal" and reported green, which is
          # how the word-count-floor breakage published nothing for a week
          # while every run still looked successful. Partial success (one of
          # several systems) still proceeds.
          if [ "$total" -gt 0 ] && [ "$fail" -ge "$total" ]; then
            echo "::error::long-form produced nothing -- all $total system(s) failed"
            exit 1
          fi

      - name: Generate + publish Shorts clips from the long-form
        if: github.event.inputs.make_clips != 'false'
        env:
          BIZZAL_YT_PRIVACY: ${{ github.event.inputs.privacy || 'unlisted' }}
          BIZZAL_SKIP_PUBLISH: ${{ github.event.inputs.dry_run == 'true' && '1' || '0' }}
        run: |
          TODAY="$(TZ=America/Denver date +%F)"
          IFS=',' read -ra SYSTEMS <<< "${{ steps.systems.outputs.systems }}"
          for sys in "${SYSTEMS[@]}"; do
            sys="$(echo "$sys" | tr -d ' ')"
            echo "=== clips: $sys ==="
            bash bin/longform/run_clips_for_system.sh "$sys" "$TODAY" \
              || echo "WARNING: clips failed for $sys (non-fatal)"
          done

      - name: Archive render to storage
        if: github.event.inputs.dry_run != 'true'
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          BIZZAL_STORAGE_BUCKET: renders
        run: |
          TODAY="$(TZ=America/Denver date +%F)"
          IFS=',' read -ra SYSTEMS <<< "${{ steps.systems.outputs.systems }}"
          for sys in "${SYSTEMS[@]}"; do
            sys="$(echo "$sys" | tr -d ' ')"
            bin/core/archive_render_to_storage.sh "longform_${sys}" "$TODAY" || true
          done

      - name: Commit state back to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/state data/longform/topic_queue.json || true
          if git diff --cached --quiet; then
            echo "no state changes to commit"
            exit 0
          fi
          git commit -m "chore(state): update longform registry [skip ci]"
          BRANCH="$(git rev-parse --abbrev-ref HEAD)"
          # Retry to survive a concurrent push (Shorts/blog/another system
          # committing state at the same time) -- the single-shot version lost
          # that race and failed the run even though the video had published.
          for attempt in 1 2 3 4 5; do
            if git pull --rebase --autostash origin "$BRANCH" && git push origin "HEAD:$BRANCH"; then
              echo "state committed (attempt $attempt)"
              exit 0
            fi
            echo "commit-back attempt $attempt lost a race; retrying..."
            sleep $((attempt * 4))
          done
          echo "::warning::commit-back failed after 5 attempts; state not persisted this run"
