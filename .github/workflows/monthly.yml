name: Monthly compilation pipeline

# Runs on the 1st of each month at 10am America/Denver (after daily shorts
# have published). Generates a long-form compilation video for every active
# RPG system and uploads it to YouTube (unlisted by default).
# Also triggerable manually via the "Run workflow" button.

on:
  schedule:
    # 10am Denver: 17:00 UTC during MST, 16:00 UTC during MDT
    - cron: "0 16 1 * *"
    - cron: "0 17 1 * *"
  workflow_dispatch:
    inputs:
      month:
        description: 'Month to compile (YYYY-MM). Defaults to previous month.'
        required: false
        default: ""
      systems:
        description: 'Which system(s): "all" (default) or a specific id like "dnd5e"'
        required: false
        default: "all"
      privacy:
        description: "YouTube privacy for this run: unlisted | private | public"
        required: false
        default: "unlisted"
      dry_run:
        description: 'Set "true" to generate the video but skip YouTube upload'
        required: false
        default: "false"

concurrency:
  group: monthly-pipeline
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      TZ: America/Denver
      # --- config / secrets ---
      BIZZAL_DB_URL: ${{ secrets.BIZZAL_DB_URL }}
      BIZZAL_OPENAI_API_KEY: ${{ secrets.BIZZAL_OPENAI_API_KEY }}
      BIZZAL_REPLICATE_API_TOKEN: ${{ secrets.BIZZAL_REPLICATE_API_TOKEN }}
      BIZZAL_YT_CLIENT_ID: ${{ secrets.BIZZAL_YT_CLIENT_ID }}
      BIZZAL_YT_CLIENT_SECRET: ${{ secrets.BIZZAL_YT_CLIENT_SECRET }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      # --- runtime behaviour ---
      BIZZAL_YT_TOKEN_FILE: ${{ github.workspace }}/.secrets/youtube_token.json
      BIZZAL_YT_NONINTERACTIVE: "1"
      BIZZAL_REQUIRE_DISCORD_APPROVAL: "0"
      BIZZAL_ENABLE_AI: "1"
      BIZZAL_ENABLE_TTS: "1"
      BIZZAL_ENABLE_BG_IMAGE: "1"
      BIZZAL_ENABLE_BG_MUSIC: "1"
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: DST-safe 10am-MT guard (scheduled runs only)
        id: guard
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "manual run; skipping time guard"
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          hour="$(TZ=America/Denver date +%H)"
          echo "America/Denver hour=$hour"
          if [ "$hour" = "10" ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          else
            echo "not 10am MT; this scheduled trigger is a no-op"
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.guard.outputs.proceed == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install ffmpeg
        if: steps.guard.outputs.proceed == 'true'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Python deps
        if: steps.guard.outputs.proceed == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Materialize YouTube OAuth token
        if: steps.guard.outputs.proceed == 'true'
        env:
          BIZZAL_YT_TOKEN_JSON: ${{ secrets.BIZZAL_YT_TOKEN_JSON }}
        run: |
          mkdir -p "$(dirname "$BIZZAL_YT_TOKEN_FILE")"
          if [ -z "$BIZZAL_YT_TOKEN_JSON" ]; then
            echo "ERROR: BIZZAL_YT_TOKEN_JSON secret is empty" >&2
            exit 1
          fi
          printf '%s' "$BIZZAL_YT_TOKEN_JSON" > "$BIZZAL_YT_TOKEN_FILE"
          echo "wrote token file ($(wc -c < "$BIZZAL_YT_TOKEN_FILE") bytes)"

      - name: Resolve target month
        if: steps.guard.outputs.proceed == 'true'
        id: month
        run: |
          INPUT="${{ github.event.inputs.month }}"
          if [ -n "$INPUT" ]; then
            echo "month=$INPUT" >> "$GITHUB_OUTPUT"
          else
            # Default: previous calendar month
            echo "month=$(date -d 'last month' +%Y-%m)" >> "$GITHUB_OUTPUT"
          fi
          echo "Compiling month: $(cat $GITHUB_OUTPUT | grep month | cut -d= -f2)"

      - name: Resolve active systems
        if: steps.guard.outputs.proceed == 'true'
        id: systems
        run: |
          SELECT="${{ github.event.inputs.systems || 'all' }}"
          if [ "$SELECT" = "all" ]; then
            SYSTEMS=$(python3 -c "
          import sys; sys.path.insert(0, 'bin/core')
          import system_config
          print(' '.join(system_config.list_active_system_ids()))
          ")
          else
            SYSTEMS="${SELECT//,/ }"
          fi
          echo "systems=$SYSTEMS" >> "$GITHUB_OUTPUT"
          echo "Resolved systems: $SYSTEMS"

      - name: Run monthly compilation for each system
        if: steps.guard.outputs.proceed == 'true'
        env:
          BIZZAL_YT_PRIVACY: ${{ github.event.inputs.privacy || 'unlisted' }}
          BIZZAL_SKIP_PUBLISH: ${{ github.event.inputs.dry_run == 'true' && '1' || '0' }}
        run: |
          MONTH="${{ steps.month.outputs.month }}"
          SYSTEMS="${{ steps.systems.outputs.systems }}"
          rc_overall=0
          for sys_id in $SYSTEMS; do
            echo "=== Monthly compilation: $sys_id ($MONTH) ==="
            if bin/core/monthly_release_for_system_cron.sh "$sys_id" "$MONTH"; then
              echo "[$sys_id] release bundle OK"
              # Upload the long-form video to YouTube
              if [ "${BIZZAL_SKIP_PUBLISH:-0}" != "1" ]; then
                LONGFORM_MP4="data/archive/monthly/${MONTH}/monthly_longform_${MONTH}.mp4"
                if [ -f "$LONGFORM_MP4" ]; then
                  echo "[$sys_id] uploading $LONGFORM_MP4..."
                  TITLE_TAG=$(python3 -c "
          import sys; sys.path.insert(0, 'bin/core')
          import system_config
          row = system_config._system_row('$sys_id')
          print(row.get('display_name','$sys_id'))
          ")
                  python3 bin/upload/upload_youtube.py \
                    --file "$LONGFORM_MP4" \
                    --title "$TITLE_TAG — $MONTH Monthly Compilation" \
                    --privacy "${BIZZAL_YT_PRIVACY}" \
                    --description "Monthly long-form compilation of all $TITLE_TAG shorts from $MONTH."
                else
                  echo "[$sys_id] WARNING: no longform MP4 found at $LONGFORM_MP4" >&2
                fi
              else
                echo "[$sys_id] BIZZAL_SKIP_PUBLISH=1; skipping upload (dry run)"
              fi
            else
              rc=$?
              echo "[$sys_id] FAILED rc=$rc" >&2
              rc_overall=$rc
            fi
          done
          exit "$rc_overall"

      - name: Commit state back to repo
        if: steps.guard.outputs.proceed == 'true' && always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/state || true
          if git diff --cached --quiet; then
            echo "no state changes to commit"
          else
            git commit -m "chore(state): monthly compilation state [skip ci]"
            git push
          fi
