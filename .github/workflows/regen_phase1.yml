name: regen phase1 - generate script only (temp)

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  BIZZAL_DB_URL: ${{ secrets.BIZZAL_DB_URL }}
  BIZZAL_OPENAI_API_KEY: ${{ secrets.BIZZAL_OPENAI_API_KEY }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  BIZZAL_OPENAI_MODEL: "gpt-4o"
  BIZZAL_ENABLE_AI: "1"
  BIZZAL_ENABLE_AI_SCRIPT: "1"

jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Ensure scripts executable
        run: |
          chmod +x bin/core/attach_fact.py bin/core/pick_style.py bin/core/write_script_from_fact.py || true
      - name: Generate script for both targets
        run: python3 _tmp_regen_gen.py
      - name: Commit generated output for inspection
        run: |
          git config user.name "verify-bot"
          git config user.email "verify-bot@users.noreply.github.com"
          git add _tmp_regen_results.json
          git add data/atoms_regen_* 2>/dev/null || true
          git status
          git commit -m "temp: regenerated script output for review" || echo "nothing to commit"
          git push || echo "nothing to push"
