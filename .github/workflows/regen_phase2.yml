name: regen phase2 - render, upload, delete old (temp)

on:
  workflow_dispatch:
    inputs:
      delete_old:
        description: 'Set "true" to also delete the 2 old bad videos after upload. Default just uploads new ones.'
        required: false
        default: "false"

permissions:
  contents: write

env:
  TZ: America/Denver
  BIZZAL_DB_URL: ${{ secrets.BIZZAL_DB_URL }}
  BIZZAL_OPENAI_API_KEY: ${{ secrets.BIZZAL_OPENAI_API_KEY }}
  BIZZAL_REPLICATE_API_TOKEN: ${{ secrets.BIZZAL_REPLICATE_API_TOKEN }}
  BIZZAL_YT_CLIENT_ID: ${{ secrets.BIZZAL_YT_CLIENT_ID }}
  BIZZAL_YT_CLIENT_SECRET: ${{ secrets.BIZZAL_YT_CLIENT_SECRET }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  BIZZAL_YT_TOKEN_FILE: ${{ github.workspace }}/.secrets/youtube_token.json
  BIZZAL_YT_NONINTERACTIVE: "1"
  BIZZAL_PREVENT_SAME_DAY_RERUN: "0"
  BIZZAL_OPENAI_MODEL: "gpt-4o"
  BIZZAL_ENABLE_AI: "1"
  BIZZAL_ENABLE_AI_SCRIPT: "1"
  BIZZAL_ENABLE_TTS: "1"
  BIZZAL_ENABLE_BG_IMAGE: "1"
  BIZZAL_ENABLE_BG_MUSIC: "1"
  BIZZAL_BG_MUSIC_GAIN: "0.25"
  BIZZAL_BG_STYLE: "bw_rtfm"
  BIZZAL_TTS_SPEED: "0.9"
  BIZZAL_SHORTS_DURATION: "55"
  BIZZAL_BODY_PAGE_MIN_SEC: "6"
  BIZZAL_TTS_BODY_PAGE_MIN_SEC: "6"
  BIZZAL_END_FADE_SEC: "1.2"
  BIZZAL_END_BLACK_PAD_SEC: "0.5"
  BIZZAL_BRAND_ICON_SIZE: "100"
  BIZZAL_YT_PRIVACY: "public"

jobs:
  render_upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Materialize YouTube OAuth token
        env:
          BIZZAL_YT_TOKEN_JSON: ${{ secrets.BIZZAL_YT_TOKEN_JSON }}
        run: |
          mkdir -p "$(dirname "$BIZZAL_YT_TOKEN_FILE")"
          printf '%s' "$BIZZAL_YT_TOKEN_JSON" > "$BIZZAL_YT_TOKEN_FILE"
      - name: Ensure scripts executable
        run: |
          chmod +x bin/render/render_atom.sh bin/upload/upload_youtube.py bin/render/synthesize_bg_image_replicate.py bin/render/synthesize_music_replicate.py || true
      - name: Validate + move regenerated atoms
        run: python3 _tmp_regen_validate.py
      - name: Render + upload fey-wanderer
        run: |
          source bin/core/system_env.sh dnd5e
          export BIZZAL_ATOM_VALIDATED_DIR="data/atoms_regen_fey-wanderer/validated"
          export BIZZAL_RENDERS_BY_DAY_DIR="data/renders_regen_fey-wanderer/by_day"
          export BIZZAL_RENDERS_LATEST_DIR="data/renders_regen_fey-wanderer/latest"
          export BIZZAL_RENDERS_TMP_DIR="data/renders_regen_fey-wanderer/tmp"
          export BIZZAL_PUBLISH_REGISTRY="data/state/published_registry_dnd5e.json"
          export BIZZAL_STYLE_HISTORY_PATH="data/state/style_history_dnd5e.json"
          DAY="2026-07-31-regen-fey-wanderer"
          bin/render/render_atom.sh "$DAY"
          python bin/upload/upload_youtube.py --day "$DAY"
      - name: Render + upload awakened-tree
        run: |
          source bin/core/system_env.sh dnd5e
          export BIZZAL_ATOM_VALIDATED_DIR="data/atoms_regen_awakened-tree/validated"
          export BIZZAL_RENDERS_BY_DAY_DIR="data/renders_regen_awakened-tree/by_day"
          export BIZZAL_RENDERS_LATEST_DIR="data/renders_regen_awakened-tree/latest"
          export BIZZAL_RENDERS_TMP_DIR="data/renders_regen_awakened-tree/tmp"
          export BIZZAL_PUBLISH_REGISTRY="data/state/published_registry_dnd5e.json"
          export BIZZAL_STYLE_HISTORY_PATH="data/state/style_history_dnd5e.json"
          DAY="2026-07-31-regen-awakened-tree"
          bin/render/render_atom.sh "$DAY"
          python bin/upload/upload_youtube.py --day "$DAY"
      - name: Extract new video IDs from registry
        run: |
          python3 - <<'PY'
          import json
          data = json.load(open("data/state/published_registry_dnd5e.json", encoding="utf-8"))
          items = data.get("items", data) if isinstance(data, dict) else data
          out = {}
          for it in items:
              if it.get("day") in ("2026-07-31-regen-fey-wanderer", "2026-07-31-regen-awakened-tree"):
                  out[it["day"]] = it.get("youtube_video_id")
          with open("_tmp_new_video_ids.json", "w", encoding="utf-8") as f:
              json.dump(out, f, indent=2)
          print(out)
          PY
      - name: Delete old bad videos (only if delete_old=true)
        if: github.event.inputs.delete_old == 'true'
        run: |
          python3 - <<'PY'
          import os
          from google.oauth2.credentials import Credentials
          from google.auth.transport.requests import Request
          from googleapiclient.discovery import build

          OLD_IDS = ["xOj74v5ekDQ", "xskRZfy8Vpc"]

          SCOPES = ["https://www.googleapis.com/auth/youtube.force-ssl",
                    "https://www.googleapis.com/auth/youtube.readonly"]
          creds = Credentials.from_authorized_user_file(".secrets/youtube_token.json", SCOPES)
          creds.refresh(Request())
          yt = build("youtube", "v3", credentials=creds)

          for vid in OLD_IDS:
              try:
                  yt.videos().delete(id=vid).execute()
                  print(f"deleted {vid}")
              except Exception as exc:
                  print(f"FAILED to delete {vid}: {exc}")
          PY
      - name: Commit state + new video id mapping
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/state _tmp_new_video_ids.json _tmp_regen_validate_results.json 2>/dev/null || true
          git status
          git commit -m "chore(state): regenerated fey-wanderer + awakened-tree shorts" || echo "nothing to commit"
          git push || echo "nothing to push"
