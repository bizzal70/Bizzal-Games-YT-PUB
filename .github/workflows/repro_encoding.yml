name: repro encoding bug (temp)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repro:
    runs-on: ubuntu-latest
    env:
      BIZZAL_SYSTEM_ID: dnd5e
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run build_description live with the real atom shape, write raw bytes to a file
        run: |
          python - <<'PYEOF'
          import sys, locale
          sys.path.insert(0, "bin/upload")
          sys.path.insert(0, "bin/core")
          print("default encoding:", sys.getdefaultencoding())
          print("stdout encoding:", sys.stdout.encoding)
          print("locale:", locale.getlocale())

          import upload_youtube as uy

          atom = {
              "category": "class_spotlight",
              "angle": "party_role_pivot",
              "fact": {"name": "Path of Wild Magic"},
              "script": {
                  "hook": "Path of Wild Magic triggers random magical effects while raging.",
                  "body": "Magic Awareness at 3rd level allows detection of spells or magic items within 60 feet as an action.",
                  "cta": "DMs: Signal the Path of Wild Magic pivot by declaring your action economy shift.",
              },
          }
          desc = uy.build_description(atom, "2026-07-30")

          with open("repro_desc.txt", "w", encoding="utf-8") as f:
              f.write(desc)
          print("wrote repro_desc.txt, len=", len(desc))

          # also check the raw bytes right here for the tell-tale markers
          raw = desc.encode("utf-8")
          markers = ["Â·".encode("utf-8"), "▶".encode("utf-8")]
          print("contains mojibake marker (Â·) bytes:", markers[0] in raw)
          print("contains clean ▶ bytes:", markers[1] in raw)
          PYEOF
      - name: Commit the repro output for byte-accurate inspection
        run: |
          git config user.name "verify-bot"
          git config user.email "verify-bot@users.noreply.github.com"
          git add repro_desc.txt
          git commit -m "temp: build_description live repro output"
          git push
