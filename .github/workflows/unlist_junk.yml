name: unlist junk videos (temp)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unlist:
    runs-on: ubuntu-latest
    env:
      BIZZAL_YT_TOKEN_FILE: /home/runner/work/Bizzal-Games-YT-PUB/Bizzal-Games-YT-PUB/.secrets/youtube_token.json
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install -q google-api-python-client google-auth google-auth-oauthlib google-auth-httplib2
      - name: Materialize YouTube OAuth token
        env:
          BIZZAL_YT_TOKEN_JSON: ${{ secrets.BIZZAL_YT_TOKEN_JSON }}
        run: |
          mkdir -p .secrets
          printf '%s' "$BIZZAL_YT_TOKEN_JSON" > .secrets/youtube_token.json
      - name: Flip junk videos to unlisted
        run: |
          python - <<'PY'
          from google.oauth2.credentials import Credentials
          from google.auth.transport.requests import Request
          from googleapiclient.discovery import build

          SCOPES = [
              "https://www.googleapis.com/auth/youtube.upload",
              "https://www.googleapis.com/auth/youtube.readonly",
              "https://www.googleapis.com/auth/youtube.force-ssl",
          ]
          creds = Credentials.from_authorized_user_file(".secrets/youtube_token.json", SCOPES)
          creds.refresh(Request())
          yt = build("youtube", "v3", credentials=creds)

          # 4 orphaned duplicates from the concurrency bug + 5 defective titles
          TARGETS = [
              ("x2c8QsIjoS8", "dup: Summoning Spellcasting Check consumes Mana"),
              ("v2RuXdtRvqk", "dup: Summoning Spellcasting Check consumes Mana"),
              ("V3uiGcwOPqU", "dup: Conjured Beings duration"),
              ("c7rGGGdXbf8", "dup: Summoner control limit"),
              ("znFlAAT2fTE", "bad title: Mechanics moment (generic)"),
              ("bJ9qAebf-bY", "bad title: Use Mastiff (advice voice)"),
              ("DkMFXh2yoj8", "bad title: Use Ogre Chain Brute (advice voice)"),
              ("PNHt-6gkAxo", "bad title: truncated 'duplicate the'"),
              ("sQXVIIbWbng", "bad title: bullet artifact"),
          ]

          ok = fail = 0
          for vid, why in TARGETS:
              try:
                  resp = yt.videos().list(part="status,snippet", id=vid).execute()
                  items = resp.get("items", [])
                  if not items:
                      print(f"SKIP {vid} — not found (already deleted?)  [{why}]")
                      continue
                  status = items[0]["status"]
                  title = items[0]["snippet"]["title"][:48]
                  before = status.get("privacyStatus")
                  if before == "unlisted":
                      print(f"OK   {vid} — already unlisted  |{title}")
                      ok += 1
                      continue
                  # preserve the rest of the status part, change only privacy
                  status["privacyStatus"] = "unlisted"
                  status.pop("publishAt", None)   # can't keep a schedule on unlisted
                  yt.videos().update(part="status", body={"id": vid, "status": status}).execute()
                  print(f"OK   {vid} — {before} -> unlisted  |{title}")
                  ok += 1
              except Exception as exc:
                  print(f"FAIL {vid} — {exc}  [{why}]")
                  fail += 1
          print(f"\nDONE: {ok} unlisted/ok, {fail} failed")
          PY
