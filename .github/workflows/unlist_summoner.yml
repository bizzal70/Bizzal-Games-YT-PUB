name: unlist shadowdark summoner set (temp)

on:
  workflow_dispatch:
    inputs:
      execute:
        description: 'Set "true" to actually unlist. Default is a dry run.'
        required: false
        default: "false"

permissions:
  contents: read

jobs:
  unlist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install -q google-api-python-client google-auth google-auth-oauthlib google-auth-httplib2
      - name: Materialize YouTube OAuth token
        env:
          BIZZAL_YT_TOKEN_JSON: ${{ secrets.BIZZAL_YT_TOKEN_JSON }}
        run: |
          mkdir -p .secrets
          printf '%s' "$BIZZAL_YT_TOKEN_JSON" > .secrets/youtube_token.json
      - name: Unlist the confabulated Godzilla-family Shadowdark Summoner videos
        env:
          EXECUTE: ${{ github.event.inputs.execute }}
        run: |
          python - <<'PY'
          import os
          from google.oauth2.credentials import Credentials
          from google.auth.transport.requests import Request
          from googleapiclient.discovery import build

          EXECUTE = (os.environ.get("EXECUTE") or "").strip().lower() == "true"

          # EXACT ids only — the 2026-07-20 "Shadowdark Summoner" longform + its 3 clips.
          # Summoner is a Daggerheart playtest class; it does not exist in Shadowdark.
          TARGETS = {
              "BHX0I5dEuys": "longform: Shadowdark Summoner mechanics",
              "kkBXYhfLRBQ": "clip 1",
              "aaxltSAGJzg": "clip 2",
              "r5c5W-kWLDI": "clip 3",
          }

          SCOPES = ["https://www.googleapis.com/auth/youtube.upload",
                    "https://www.googleapis.com/auth/youtube.readonly",
                    "https://www.googleapis.com/auth/youtube.force-ssl"]
          creds = Credentials.from_authorized_user_file(".secrets/youtube_token.json", SCOPES)
          creds.refresh(Request())
          yt = build("youtube", "v3", credentials=creds)

          ids = list(TARGETS)
          resp = yt.videos().list(part="snippet,status", id=",".join(ids)).execute()
          found = {it["id"]: it for it in resp.get("items", [])}

          missing = [v for v in ids if v not in found]
          for v in missing:
              print(f"  !! NOT FOUND on this channel: {v} ({TARGETS[v]})")

          plan = []
          for v in ids:
              it = found.get(v)
              if not it:
                  continue
              st = it["status"]
              cur = st.get("privacyStatus", "?")
              title = it["snippet"]["title"]
              print(f"  {v}  [{cur:8}]  {title[:60]}   <- {TARGETS[v]}")
              if cur != "unlisted":
                  plan.append((v, it))

          print(f"\n{len(plan)} to unlist | {len(found)-len(plan)} already unlisted/other | {len(missing)} missing")

          if not EXECUTE:
              print("\nDRY RUN — nothing changed. Re-run with execute=true to apply.")
          else:
              done = 0
              for v, it in plan:
                  st = it["status"]
                  body = {"id": v, "status": {
                      "privacyStatus": "unlisted",
                      "selfDeclaredMadeForKids": st.get("selfDeclaredMadeForKids", False),
                      "license": st.get("license", "youtube"),
                      "embeddable": st.get("embeddable", True),
                      "publicStatsViewable": st.get("publicStatsViewable", True),
                  }}
                  try:
                      yt.videos().update(part="status", body=body).execute()
                      done += 1
                      print(f"  unlisted {v}")
                  except Exception as exc:
                      print(f"  FAILED  {v}: {exc}")
              print(f"\nDONE: {done}/{len(plan)} unlisted")
          PY
