name: verify description bytes (temp)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install -q google-api-python-client google-auth google-auth-oauthlib google-auth-httplib2
      - name: Materialize YouTube OAuth token
        env:
          BIZZAL_YT_TOKEN_JSON: ${{ secrets.BIZZAL_YT_TOKEN_JSON }}
        run: |
          mkdir -p .secrets
          printf '%s' "$BIZZAL_YT_TOKEN_JSON" > .secrets/youtube_token.json
      - name: Pull raw description bytes for a flagged video and write to a file
        run: |
          python - <<'PYEOF'
          from google.oauth2.credentials import Credentials
          from google.auth.transport.requests import Request
          from googleapiclient.discovery import build

          SCOPES = ["https://www.googleapis.com/auth/youtube.readonly",
                    "https://www.googleapis.com/auth/youtube.force-ssl"]
          creds = Credentials.from_authorized_user_file(".secrets/youtube_token.json", SCOPES)
          creds.refresh(Request())
          yt = build("youtube", "v3", credentials=creds)

          vid = "zvsd7_MtTUA"
          d = yt.videos().list(part="snippet", id=vid).execute()
          desc = d["items"][0]["snippet"]["description"]

          # Write the RAW description bytes directly to a file, UTF-8, no intermediate
          # log/print pipeline that could re-encode it.
          with open("desc_raw_check.txt", "w", encoding="utf-8") as f:
              f.write(desc)
          print("wrote desc_raw_check.txt, len=", len(desc))
          PYEOF
      - name: Commit the raw file so it can be fetched via the contents API
        run: |
          git config user.name "verify-bot"
          git config user.email "verify-bot@users.noreply.github.com"
          git add desc_raw_check.txt
          git commit -m "temp: raw description byte check"
          git push
