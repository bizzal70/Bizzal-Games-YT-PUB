name: verify content-reviewer findings (temp)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install -q google-api-python-client google-auth google-auth-oauthlib google-auth-httplib2
      - name: Materialize YouTube OAuth token
        env:
          BIZZAL_YT_TOKEN_JSON: ${{ secrets.BIZZAL_YT_TOKEN_JSON }}
        run: |
          mkdir -p .secrets
          printf '%s' "$BIZZAL_YT_TOKEN_JSON" > .secrets/youtube_token.json
      - name: Check for real encoding corruption + title truncation + Path of Wild Magic content
        run: |
          python - <<'PYEOF'
          import json, base64
          from google.oauth2.credentials import Credentials
          from google.auth.transport.requests import Request
          from googleapiclient.discovery import build

          SCOPES = ["https://www.googleapis.com/auth/youtube.readonly",
                    "https://www.googleapis.com/auth/youtube.force-ssl"]
          creds = Credentials.from_authorized_user_file(".secrets/youtube_token.json", SCOPES)
          creds.refresh(Request())
          yt = build("youtube", "v3", credentials=creds)

          ch = yt.channels().list(part="contentDetails", mine=True).execute()
          uploads = ch["items"][0]["contentDetails"]["relatedPlaylists"]["uploads"]
          ids, token = [], None
          while True:
              r = yt.playlistItems().list(part="snippet", playlistId=uploads, maxResults=50, pageToken=token).execute()
              ids += [i["snippet"]["resourceId"]["videoId"] for i in r.get("items", [])]
              token = r.get("nextPageToken")
              if not token:
                  break

          rows = []
          for i in range(0, len(ids), 50):
              d = yt.videos().list(part="snippet", id=",".join(ids[i:i+50])).execute()
              rows += d.get("items", [])

          print(f"total videos: {len(rows)}\n")

          # 1) encoding corruption scan: look for mojibake byte sequences
          BAD_MARKERS = ["Â", "â€“", "â€”", "â€™", "â–¶", "ðŸ“–", "ðŸ“º", "Ã©"]
          hits = []
          for it in rows:
              sn = it["snippet"]
              blob = sn.get("title","") + "\n" + sn.get("description","")
              found = [m for m in BAD_MARKERS if m in blob]
              if found:
                  hits.append((it["id"], sn["title"][:50], found))
          print(f"=== ENCODING CORRUPTION: {len(hits)}/{len(rows)} videos affected ===")
          for vid, title, found in hits[:15]:
              print(f"  {vid}  {title!r}  markers={found}")
          if len(hits) > 15:
              print(f"  ... and {len(hits)-15} more")

          # 2) title truncation scan: titles ending mid-word/mid-phrase (no terminal punctuation,
          # ending on a preposition/conjunction, or hitting exactly 100 chars = truncated by YT)
          import re
          trunc_endings = re.compile(r"\b(a|an|the|of|per|to|in|on|for|with|and|or|as|at)$", re.I)
          trunc_hits = []
          for it in rows:
              t = it["snippet"]["title"]
              core = t.split(" #")[0].strip()  # ignore trailing hashtags
              if len(t) >= 99 or trunc_endings.search(core):
                  trunc_hits.append((it["id"], t))
          print(f"\n=== POSSIBLE TITLE TRUNCATION: {len(trunc_hits)} videos ===")
          for vid, t in trunc_hits[:15]:
              print(f"  {vid}  len={len(t)}  {t!r}")

          # 3) find the specific "Path of Wild Magic" video and print its full description
          print("\n=== Path of Wild Magic search ===")
          for it in rows:
              if "wild magic" in it["snippet"]["title"].lower():
                  print(f"  id={it['id']}")
                  print(f"  title={it['snippet']['title']!r}")
                  print(f"  description={it['snippet']['description']!r}")
          PYEOF
