name: YT scope check (temp)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install -q google-api-python-client google-auth google-auth-oauthlib google-auth-httplib2
      - name: Materialize token
        env:
          BIZZAL_YT_TOKEN_JSON: ${{ secrets.BIZZAL_YT_TOKEN_JSON }}
        run: |
          mkdir -p .secrets
          printf '%s' "$BIZZAL_YT_TOKEN_JSON" > .secrets/youtube_token.json
          python -c "import json;d=json.load(open('.secrets/youtube_token.json'));print('token JSON keys:',sorted(d.keys()));print('declared scopes:',d.get('scopes'))"
      - name: Scope + captions check
        run: |
          python - <<'PY'
          from google.oauth2.credentials import Credentials
          from google.auth.transport.requests import Request
          from googleapiclient.discovery import build

          SCOPES = [
              "https://www.googleapis.com/auth/youtube.upload",
              "https://www.googleapis.com/auth/youtube.readonly",
              "https://www.googleapis.com/auth/youtube.force-ssl",
          ]
          creds = Credentials.from_authorized_user_file(".secrets/youtube_token.json", SCOPES)
          creds.refresh(Request())          # fails here if force-ssl was NOT granted
          print("[ok] token refreshed; scopes:", creds.scopes)

          yt = build("youtube", "v3", credentials=creds)
          ch = yt.channels().list(part="snippet", mine=True).execute().get("items", [])
          if ch:
              print("[ok] channel:", ch[0]["snippet"]["title"])

          # captions.list REQUIRES youtube.force-ssl -> the definitive test.
          vid = "Q0KX14YQ2RA"
          caps = yt.captions().list(part="snippet", videoId=vid).execute()
          print(f"[ok] captions.list on {vid}: {len(caps.get('items', []))} track(s)")
          print("FORCE_SSL_CONFIRMED")
          PY
