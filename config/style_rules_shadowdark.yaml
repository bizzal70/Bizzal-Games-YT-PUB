defaults:
  length: shorts
  spice_rate: 0.4
  tones:
    - gritty
    - neutral
    - ominous
  persona_default: torchbearer_referee
  voiceover_default:
    voice_pack_id: voice-shadowdark-ref
    tts_voice_id: onyx

persona_by_category:
  monster_tactic: tactical_analyst
  spell_use_case: arcane_survival_coach
  item_spotlight: dungeon_gear_mentor
  encounter_seed: dm_story_coach
  rules_ruling: rules_referee
  rules_myth: rules_referee
  class_spotlight: class_mentor
  character_micro_tip: class_mentor

tones_by_category:
  monster_tactic: [gritty, ominous]
  spell_use_case: [gritty, neutral]
  item_spotlight: [gritty, neutral]
  encounter_seed: [ominous, gritty]
  rules_ruling: [neutral, gritty]
  rules_myth: [neutral, gritty]
  class_spotlight: [gritty, neutral]
  character_micro_tip: [gritty, neutral]

voiceover_by_tone:
  neutral:
    voice_pack_id: voice-shadowdark-ref
    tts_voice_ids: [ash, alloy]
  gritty:
    voice_pack_id: voice-shadowdark-grit
    tts_voice_ids: [onyx, echo]
  ominous:
    voice_pack_id: voice-shadowdark-ominous
    tts_voice_ids: [onyx, fable]

persona_profiles:
  torchbearer_referee:
    one_liner: Practical, high-stakes guidance for lethal dungeon play.
  tactical_analyst:
    one_liner: Threat-first tactics with strict economy of action.
  arcane_survival_coach:
    one_liner: Spell use focused on survival, tempo, and risk control.
  dungeon_gear_mentor:
    one_liner: Resource-first gear coaching for dangerous exploration.
  dm_story_coach:
    one_liner: Tight encounter framing with pressure and consequence.
  rules_referee:
    one_liner: Crisp rulings that keep momentum and fairness.
  class_mentor:
    one_liner: Role-focused class guidance with concrete play impact.

voices:
  torchbearer_ref:
    hooks:
      - "Torchlight briefing: {name}."
      - "Dungeon brief: {name}."
    ctas:
      - "DMs: put pressure on time, light, and noise."
      - "Players: solve for survival before style points."
  grim_warden:
    hooks:
      - "In the dark, {name} matters."
      - "Hard lesson: {name}."
    ctas:
      - "DMs: reward caution and punish noise."
      - "Players: win with prep, not bravado."
  strict_referee:
    hooks:
      - "Ruling check: {name}."
      - "Table call: {name}."
    ctas:
      - "Keep rulings fast, clear, and consistent."
      - "Call intent first, then roll."

category_rules:
  monster_tactic:
    angles: [how_it_wins, common_mistake, counterplay]
    voices: [grim_warden, strict_referee, torchbearer_ref]
  spell_use_case:
    angles: [best_moment, common_misplay, dm_twist]
    voices: [torchbearer_ref, strict_referee, grim_warden]
  item_spotlight:
    angles: [clever_use, best_user, drawback_watchout]
    voices: [torchbearer_ref, grim_warden, strict_referee]
  encounter_seed:
    angles: [three_beats, twist, time_pressure, moral_choice]
    voices: [grim_warden, torchbearer_ref, strict_referee]
  rules_ruling:
    angles: [fast_ruling, common_table_mistake, edge_case]
    voices: [strict_referee, torchbearer_ref, grim_warden]
  rules_myth:
    angles: [myth_vs_rule, quick_example, dm_callout]
    voices: [strict_referee, torchbearer_ref, grim_warden]
  class_spotlight:
    angles: [early_power_spike, party_role_pivot, progression_trap]
    voices: [torchbearer_ref, grim_warden, strict_referee]
  character_micro_tip:
    angles: [level_1_choice, party_role, survivability]
    voices: [torchbearer_ref, grim_warden, strict_referee]
