weekly_spine:
  mon: monster_tactic
  tue: rules_ruling
  wed: item_spotlight
  thu: encounter_seed
  fri: rules_myth
  sat: spell_use_case
  sun: class_spotlight

defaults:
  ruleset: shadowdark_v4_8
  target_seconds: 55
  tone: grim_practical
  reading_level: general
  no_homebrew_mechanics: true

category_weights:
  monster_tactic:
    angles:
      how_it_wins: 3
      how_to_counter: 3
      common_mistake: 2
      terrain_synergy: 2

  spell_use_case:
    angles:
      best_moment: 3
      common_mistake: 3
      dm_counterplay: 2
      combo_pairing: 2

  rules_ruling:
    angles:
      fast_ruling: 3
      common_table_mistake: 3
      edge_case: 2
      player_tip: 2

  item_spotlight:
    angles:
      clever_use: 3
      best_user: 3
      drawback_watchout: 2
      story_hook: 2

  encounter_seed:
    angles:
      three_beats: 3
      twist: 3
      time_pressure: 2
      moral_choice: 2

  rules_myth:
    angles:
      myth_vs_rule: 4
      quick_example: 3
      why_people_get_it_wrong: 2

  class_spotlight:
    angles:
      early_power_spike: 3
      party_role_pivot: 3
      progression_trap: 2
      resource_breakpoint: 2
